<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Records</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #2563eb;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #e0e7ff;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>My Student Database</h1>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Address</th>
          <th>Age</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>1</td>
          <td>Rahul</td>
          <td>Ambikapur</td>
          <td>20</td>
        </tr>

        <tr>
          <td>2</td>
          <td>Priya</td>
          <td>Raipur</td>
          <td>21</td>
        </tr>

        <tr>
          <td>3</td>
          <td>Aman</td>
          <td>Bilaspur</td>
          <td>19</td>
        </tr>
      </tbody>
    </table>

  </div>

</body>
</html>
